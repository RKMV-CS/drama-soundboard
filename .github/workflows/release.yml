name: Release
# Push a tag like v0.9.0 to build the Windows app and installer and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:sea
      - name: Install NSIS if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) { $nsis | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
      - run: npm run build:installer
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare release $tag" }
          $assets = Get-ChildItem dist\*.exe, dist\SHA256SUMS.txt | ForEach-Object { $_.FullName }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
      - name: Keep build as artifact on manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
